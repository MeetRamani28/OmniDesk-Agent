events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Edge-level Rate Limiting (DDoS mitigation before traffic even reaches Express)
    limit_req_zone $binary_remote_addr zone=edge_limit:10m rate=50r/s;

    # Internal Docker Bridge network DNS resolution
    upstream frontend_upstream {
        server frontend:80;
    }

    upstream backend_upstream {
        server backend:5000;
    }

    server {
        listen 80;
        server_name localhost;

        # 1. Frontend SPA Traffic
        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. Backend REST API Traffic
        location /api/ {
            limit_req zone=edge_limit burst=20 nodelay;
            proxy_pass http://backend_upstream/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 3. WebSockets (Socket.io) Persistent Connection
        location /socket.io/ {
            proxy_pass http://backend_upstream/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }
    }
}
